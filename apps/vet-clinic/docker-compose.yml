version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: vet-db
    environment:
      POSTGRES_USER: vet_user
      POSTGRES_PASSWORD: vet_password
      POSTGRES_DB: vet_dev
    ports:
      - "5434:5432"
    volumes:
      - vet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vet_user -d vet_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vet-backend
    ports:
      - "8081:8081"
    environment:
      - NODE_ENV=development
      - PORT=8081
      - DATABASE_URL=postgresql://vet_user:vet_password@db:5432/vet_dev
      - CANADA_PHIPA_READY=false
      - JWT_SECRET=dev_secret_change_in_production_vet_12345
      - POS_ADAPTER=mock
      - NOTIFICATION_ADAPTER=mock
      - LOG_LEVEL=info
      - LOG_REDACTION_ENABLED=true
      - CORS_ORIGIN=http://localhost:3002
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:-}
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vet-frontend
    ports:
      - "3002:3000"
    environment:
      - VITE_API_URL=http://localhost:8081
      - VITE_CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY:-}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  vet_postgres_data:
